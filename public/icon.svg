<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Filtro de resplandor esmeralda ambiental -->
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Bisel especular superior del contenedor squircle -->
    <linearGradient id="squircleSpecular" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45" />
      <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.02" />
    </linearGradient>

    <!-- Borde del contenedor squircle -->
    <linearGradient id="squircleBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.08" />
    </linearGradient>

    <!-- Capa 1: Borde del Plato de Vinilo (Blanco especular a Verde Esmeralda) -->
    <linearGradient id="iconPlatterStroke" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="45%" stop-color="#34D399" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.95" />
    </linearGradient>

    <!-- Capa 1: Relleno Radial Esmeralda Translúcido del Plato -->
    <radialGradient id="iconPlatterFill" cx="42%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#064E3B" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#021E17" stop-opacity="0.9" />
    </radialGradient>

    <!-- Capa 2: Surcos de Luz (#A7F3D0) -->
    <linearGradient id="iconGrooveSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A7F3D0" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#34D399" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#A7F3D0" stop-opacity="0.85" />
    </linearGradient>

    <!-- Capa 3: Núcleo Central Oscuro -->
    <radialGradient id="iconCoreBg" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#0B1411" />
      <stop offset="80%" stop-color="#030806" />
      <stop offset="100%" stop-color="#052E22" />
    </radialGradient>

    <!-- Capa 3: Borde Luminoso Esmeralda/Blanco del Núcleo -->
    <linearGradient id="iconCoreStroke" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#34D399" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.95" />
    </linearGradient>
  </defs>

  <!-- 1. Contenedor Squircle Liquid Glass Base -->
  <rect x="4" y="4" width="92" height="92" rx="22" ry="22" fill="#0A0E1A" stroke="url(#squircleBorder)" stroke-width="1.5" />

  <!-- Iluminación ambiental interna esmeralda -->
  <circle cx="50" cy="50" r="32" fill="#10B981" fill-opacity="0.22" filter="url(#emeraldGlow)" />

  <!-- Reflejo diagonal sutil del cristal -->
  <rect x="4" y="4" width="92" height="92" rx="22" ry="22" fill="url(#squircleSpecular)" pointer-events="none" />

  <!-- 2. Isotipo SVG del Vinilo (3 Capas Limpias) -->
  <g transform="translate(0, 0)">
    <!-- CAPA 1: PLATO DE VINILO -->
    <circle cx="50" cy="50" r="32" fill="url(#iconPlatterFill)" stroke="url(#iconPlatterStroke)" stroke-width="2" />
    
    <!-- Micro-surcos concéntricos -->
    <circle cx="50" cy="50" r="26" fill="none" stroke="#10B981" stroke-width="0.6" stroke-opacity="0.3" />
    <circle cx="50" cy="50" r="20" fill="none" stroke="#10B981" stroke-width="0.6" stroke-opacity="0.22" />

    <!-- CAPA 2: SURCOS DE LUZ (Reflejos de arco simétricos) -->
    <path d="M 32 32 A 25 25 0 0 1 68 32" fill="none" stroke="url(#iconGrooveSheen)" stroke-width="2" stroke-linecap="round" />
    <path d="M 68 68 A 25 25 0 0 1 32 68" fill="none" stroke="url(#iconGrooveSheen)" stroke-width="2" stroke-linecap="round" />
    <path d="M 37 37 A 18 18 0 0 1 63 37" fill="none" stroke="url(#iconGrooveSheen)" stroke-width="1.4" stroke-linecap="round" stroke-opacity="0.75" />
    <path d="M 63 63 A 18 18 0 0 1 37 63" fill="none" stroke="url(#iconGrooveSheen)" stroke-width="1.4" stroke-linecap="round" stroke-opacity="0.75" />

    <!-- CAPA 3: NÚCLEO CENTRAL -->
    <circle cx="50" cy="50" r="11" fill="url(#iconCoreBg)" stroke="url(#iconCoreStroke)" stroke-width="1.6" />
    
    <!-- Orificio central -->
    <circle cx="50" cy="50" r="3.5" fill="#090A0F" stroke="#10B981" stroke-width="0.8" stroke-opacity="0.7" />

    <!-- Punto de reflejo especular blanco en la esquina superior izquierda -->
    <circle cx="45.5" cy="45.5" r="1.3" fill="#FFFFFF" fill-opacity="0.95" />
  </g>
</svg>
